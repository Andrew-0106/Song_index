{% extends "layout.html" %}
        
{% block body %}  
    <a href="/" class="button-style">Go Home</a> 
    <p>Search result for:  {{q}}  </p>
    <table>
        <thead>
            <tr>
                <th>Songs</th>
            </tr>

        </thead>
        <tbody>
            {% for song in songs %}
            <tr> 
                <td>{{ song["title"] }}</td>
            </tr>
             {% endfor %}
        </tbody>
    </table>
{% endblock %}
